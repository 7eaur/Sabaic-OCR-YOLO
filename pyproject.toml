[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sabaic-ocr-yolo"
version = "0.1.0"
description = "Custom YOLO OCR pipeline for Old South Arabian/Sabaic characters"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "Pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["sabaic_ocr*"]
